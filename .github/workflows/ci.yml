name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov fastapi uvicorn
          pip install -e ".[dev]"

      - name: Lint check (Ruff)
        run: |
          ruff check .

      - name: Formatting check (Ruff)
        run: |
          ruff format --check .

      - name: Run Test Suite & Coverage
        run: |
          pytest --cov=signalrag --cov-report=xml --cov-report=term-missing

      - name: Build Distribution Wheel
        run: |
          python -m pip install build
          python -m build
