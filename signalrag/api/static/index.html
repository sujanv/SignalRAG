<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalRAG — Production Evaluation RAG</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .badge {
      background: #0369a1;
      color: #e0f2fe;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      display: none;
    }
    .result-card h2 {
      font-size: 1.1rem;
      color: var(--subtext);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .answer-text {
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
      white-space: pre-wrap;
    }
    .sources-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .source-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .source-meta {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }
    .source-snippet {
      color: var(--subtext);
    }
    .latency-tag {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 1rem;
      text-align: right;
    }
    .spinner {
      display: none;
      text-align: center;
      padding: 2rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SignalRAG</h1>
      <span class="badge">Hybrid Search &bull; Verified Citations</span>
    </header>

    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Ask a question..." value="What is the role of BM25 in hybrid retrieval?" />
      <button id="askBtn" onclick="sendQuery()">Ask 🔍</button>
    </div>

    <div class="spinner" id="spinner">Evaluating retrieval pipeline...</div>

    <div class="result-card" id="resultCard">
      <h2>Answer</h2>
      <div class="answer-text" id="answerContent"></div>

      <div class="sources-title">Sources & Citations</div>
      <div id="sourcesList"></div>

      <div class="latency-tag" id="latencyTag"></div>
    </div>
  </div>

  <script>
    async function sendQuery() {
      const q = document.getElementById('queryInput').value.trim();
      if (!q) return;

      const spinner = document.getElementById('spinner');
      const card = document.getElementById('resultCard');
      spinner.style.display = 'block';
      card.style.display = 'none';

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, top_k: 5 })
        });
        const data = await res.json();

        document.getElementById('answerContent').innerText = data.answer;
        const sourcesDiv = document.getElementById('sourcesList');
        sourcesDiv.innerHTML = '';

        if (data.citations && data.citations.length > 0) {
          data.citations.forEach((cit, idx) => {
            const el = document.createElement('div');
            el.className = 'source-item';
            el.innerHTML = `
              <div class="source-meta">[${idx + 1}] Document: ${cit.document_id} (Chunk: ${cit.chunk_id})</div>
              <div class="source-snippet">${cit.snippet}</div>
            `;
            sourcesDiv.appendChild(el);
          });
        } else {
          sourcesDiv.innerHTML = '<div class="source-item">No external citations needed for this answer.</div>';
        }

        document.getElementById('latencyTag').innerText = `Pipeline latency: ${data.latency_ms}ms`;
        card.style.display = 'block';
      } catch (err) {
        alert('Query failed: ' + err.message);
      } finally {
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
