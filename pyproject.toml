[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalrag"
version = "0.1.0"
description = "Production-grade RAG pipeline with retrieval and answer evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sujan V" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pypdf>=4.1.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
signalrag = "signalrag.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=signalrag --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
